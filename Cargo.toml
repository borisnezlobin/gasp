[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "tools/migrate", "tools/corpus", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"

# Debug builds keep only line tables: backtraces still name the file and
# line, and the object files macOS keeps beside every build stay a fraction
# of the size. `make tidy` (run after builds) deletes builds Cargo left
# behind.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# Builds that go to other people: smaller and faster to run. Thin LTO keeps
# most of fat LTO's savings at a fraction of the build time.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
