[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "tools/migrate", "tools/corpus", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"

# Builds that go to other people: slower to compile, smaller and faster to run.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
