[package]
name = "gasp-desktop"
description = "Desktop app, plus headless CLI modes for tests and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gasp"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders at startup, for Macs without the Metal Toolchain.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
gasp-config = { path = "../../crates/config" }
gasp-core = { path = "../../crates/core" }
gasp-snippets = { path = "../../crates/snippets" }
gasp-prose = { path = "../../crates/prose" }
similar = "2.7"
gasp-export = { path = "../../crates/export" }
gasp-sync = { path = "../../crates/sync", features = ["keychain"] }
# The stand-in GitHub a snapshot run signs in to keeps bare repositories.
# gasp-sync already builds it.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
gasp-search = { path = "../../crates/search" }
gasp-vault = { path = "../../crates/vault" }
gasp-mcp = { path = "../../crates/mcp" }
gasp-migrate = { path = "../../tools/migrate" }
gpui = "=0.2.2"
image = "0.25"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"
notify = "6"
futures = "0.3"
dirs = "5"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
toml_edit = "0.22"
jiff = "0.2"
gasp-math = { path = "../../crates/math" }
gasp-highlight = { path = "../../crates/highlight" }
# Code block colours. Typst already builds both with these features, so
# they add no new crates.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.3", default-features = false, features = ["syntect-fancy"] }
# Emoji names and GitHub shortcodes for the `:` picker: generated tables
# with no dependencies.
emojis = "0.9"
# Link card metadata. GPUI already builds this reqwest fork with rustls and
# the system's roots; `blocking` adds no crates.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# The native view behind a window, for Look up and printing. GPUI already
# builds it.
raw-window-handle = "0.6"
# Round-capped strokes for the welcome tour's note lines. GPUI already
# builds it for its paths.
lyon = "1"

# AppKit messages for Look up and the print panel (PDFKit), through the
# Objective-C runtime. GPUI already builds it on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# Reading back a frame for `--snapshot`. GPUI already builds this version.
metal = "0.29"
# The welcome tour's name drawn from the system's own glyph outlines.
# GPUI already builds both.
core-text = "21"
core-graphics = "0.24"

# Updates: comparing versions, checking the download's SHA-256 and, on
# macOS, reading `hdiutil`'s and the new app's property lists. All three
# are already in the build.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
semver = "1"
sha2 = "0.10"
plist = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"
# Copy as rich text: HTML beside its plain text on the clipboard, which
# GPUI's clipboard (plain text and images only) can't offer. X11, and
# Wayland where the compositor has data control, else through XWayland.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
# Per-thread CPU time for startup tracing (`EDITOR_TRACE_STARTUP`), and the
# hostname that names this device in sync commits.
rustix = { version = "1", default-features = false, features = ["std", "system", "time", "mm"] }

[dev-dependencies]
ctor = "0.4"
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
