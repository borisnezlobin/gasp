[package]
name = "editor-desktop"
description = "Desktop app, plus headless CLI modes for tests and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "editor"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders at startup, for Macs without the Metal Toolchain.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
editor-config = { path = "../../crates/config" }
editor-core = { path = "../../crates/core" }
editor-prose = { path = "../../crates/prose" }
similar = "2.7"
editor-export = { path = "../../crates/export" }
editor-sync = { path = "../../crates/sync" }
gpui = "=0.2.2"
image = "0.25"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"
notify = "6"
futures = "0.3"
dirs = "5"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
toml_edit = "0.22"
jiff = "0.2"
editor-math = { path = "../../crates/math" }
resvg = { version = "0.45", default-features = false }
# Code block colours. Typst already builds both with these features, so
# they add no new crates.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.3", default-features = false, features = ["syntect-fancy"] }
# Emoji names and GitHub shortcodes for the `:` picker: generated tables
# with no dependencies.
emojis = "0.9"
# Link card metadata. GPUI already builds this reqwest fork with rustls and
# the system's roots; `blocking` adds no crates.
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

# The system's credential store for sync tokens. Linux keeps them in a
# private file instead, since the Secret Service needs D-Bus libraries.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
# Per-thread CPU time for startup tracing (`EDITOR_TRACE_STARTUP`).
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

[lints]
workspace = true
