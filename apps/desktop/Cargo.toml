[package]
name = "editor-desktop"
description = "Desktop app, plus headless CLI modes for tests and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "editor"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders at startup, for Macs without the Metal Toolchain.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
editor-config = { path = "../../crates/config" }
editor-core = { path = "../../crates/core" }
gpui = "=0.2.2"
image = "0.25"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[lints]
workspace = true
