[package]
name = "editor-desktop"
description = "Desktop app, plus headless CLI modes for tests and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
editor-config = { path = "../../crates/config" }
editor-core = { path = "../../crates/core" }
gpui = "=0.2.2"
image = "0.25"
notify = "6"
futures = "0.3"
dirs = "5"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
