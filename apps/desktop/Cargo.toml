[package]
name = "editor-desktop"
description = "Desktop app, plus headless CLI modes for tests and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "editor"
path = "src/main.rs"

[features]
# Compile GPUI's Metal shaders at startup, for Macs without the Metal Toolchain.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
editor-config = { path = "../../crates/config" }
editor-core = { path = "../../crates/core" }
editor-export = { path = "../../crates/export" }
gpui = "=0.2.2"
image = "0.25"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13"
notify = "6"
futures = "0.3"
dirs = "5"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
toml_edit = "0.22"
editor-math = { path = "../../crates/math" }
resvg = { version = "0.45", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = "0.13"

[target.'cfg(unix)'.dependencies]
# Per-thread CPU time for startup tracing (`EDITOR_TRACE_STARTUP`).
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
