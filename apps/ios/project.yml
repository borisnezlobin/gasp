name: Gasp
options:
  bundleIdPrefix: com.borisnezlobin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: K2MB68Z582
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # The sample vault phase reads the corpus outside the project folder.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Gasp:
    type: application
    platform: iOS
    sources:
      - path: Gasp
      - path: Core/Generated
    dependencies:
      - framework: Core/GaspCore.xcframework
        embed: false
      # libgit2 in the core talks TLS through Security and needs zlib and iconv.
      - sdk: Security.framework
      - sdk: libz.tbd
      - sdk: libiconv.tbd
    info:
      path: Gasp/Info.plist
      properties:
        CFBundleDisplayName: Gasp
        # From the build settings below, so the version and build number aren't 1.0 and 1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # gasp://open?path=Folder/Note.md&line=12 opens a note at a line.
        CFBundleURLTypes:
          - CFBundleURLName: com.borisnezlobin.gasp
            CFBundleURLSchemes: [gasp]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The vault shows in the Files app, under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Sync now and then while the app is in the background.
        UIBackgroundModes: [fetch]
        # Only standard HTTPS (GitHub sync, the update and usage pings), which is exempt,
        # so App Store Connect doesn't ask about encryption for every build.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers: [com.borisnezlobin.gasp.sync]
        # Gasp's own iCloud container, shown in iCloud Drive as a folder named Gasp.
        NSUbiquitousContainers:
          iCloud.com.borisnezlobin.gasp:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Gasp
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borisnezlobin.gasp
        PRODUCT_NAME: Gasp
        CODE_SIGN_ENTITLEMENTS: Gasp/Gasp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.2.4"
        CURRENT_PROJECT_VERSION: "1"
        # Made with the Mac icon by apps/desktop/assets/icon/build_icon.sh, each with a
        # dark version. AppIconHead is the second icon people can pick in Settings.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconHead
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    postCompileScripts:
      - name: Bundle the sample vault
        script: '"$SRCROOT/scripts/bundle-sample-vault.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: [GaspTests, GaspUITests]
  GaspTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GaspTests]
    dependencies:
      - target: Gasp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.borisnezlobin.gasp.tests
  # Drives the app in the simulator: dragging in the file tree.
  GaspUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GaspUITests]
    dependencies:
      - target: Gasp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.borisnezlobin.gasp.uitests
