[package]
name = "editor-config"
description = "Config loading, settings schema, theme tokens, rules engine and command registry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
editor-snippets = { path = "../snippets" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
notify = "6"
schemars = "0.8"
serde_json = "1"
# Settings, theme and rules files edited in place, keeping comments.
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
