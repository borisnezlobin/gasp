# Built-in rules. A vault's .gasp/rules.toml can add rules, replace one by
# giving the same id, or remove one with `delete = true`.

# ---- Default keymap. Mod is Cmd on macOS and iOS, Ctrl elsewhere. ----

# Formatting

[[rule]]
id   = "key.format.bold"
on   = "key"
keys = "Mod+B"
do   = "format.bold"

[[rule]]
id   = "key.format.italic"
on   = "key"
keys = "Mod+I"
