# Built-in rules. A vault's .editor/rules.toml can add rules, replace one by
# giving the same id, or remove one with `delete = true`.

# ---- Default keymap. Mod is Cmd on macOS and iOS, Ctrl elsewhere. ----

# Formatting

[[rule]]
id   = "key.format.bold"
on   = "key"
keys = "Mod+B"
do   = "format.bold"

[[rule]]
id   = "key.format.italic"
on   = "key"
keys = "Mod+I"
do   = "format.italic"

[[rule]]
id   = "key.format.underline"
on   = "key"
keys = "Mod+U"
do   = "format.underline"

[[rule]]
id   = "key.format.link"
on   = "key"
keys = "Mod+K"
do   = "format.link"

[[rule]]
id   = "key.format.code"
on   = "key"
keys = "Mod+E"
do   = "format.code"

[[rule]]
id   = "key.format.strikethrough"
on   = "key"
keys = "Mod+Shift+X"
do   = "format.strikethrough"

[[rule]]
id   = "key.format.highlight"
on   = "key"
keys = "Mod+Shift+H"
do   = "format.highlight"

[[rule]]
id   = "key.format.math-inline"
on   = "key"
keys = "Mod+Shift+M"
do   = "format.math-inline"

[[rule]]
id   = "key.format.comment"
on   = "key"
keys = "Mod+/"
do   = "format.comment"

[[rule]]
id   = "key.markdown.cycle-symbols"
on   = "key"
keys = "Mod+;"
do   = "markdown.cycle-symbols"

[[rule]]
id   = "key.footnote.insert-or-jump"
on   = "key"
keys = "Alt+0"
do   = "footnote.insert-or-jump"

[[rule]]
id   = "key.prose.toggle-sentence-highlighting"
on   = "key"
keys = "Mod+J"
do   = "prose.toggle-sentence-highlighting"

