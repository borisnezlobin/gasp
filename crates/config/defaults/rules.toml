# ---- Hover-to-reveal file sidebar (Mod+\ is its keyboard twin). ----

[[rule]]
id       = "hover.sidebar.files.show"
on       = "pointer.enter"
at       = "window.left-edge"
if       = { "sidebar.files.reveal" = "hover" }
do       = "sidebar.files.show"
platform = "desktop"

[[rule]]
id       = "hover.sidebar.files.hide"
on       = "pointer.leave"
at       = "sidebar.files"
after    = "300ms"
if       = { "sidebar.files.reveal" = "hover" }
do       = "sidebar.files.hide"
platform = "desktop"
