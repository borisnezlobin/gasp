# Built-in settings. A vault's .editor/settings.toml layers on top of this file.

[sidebar.files]
reveal = "hover"      # "always" | "toggle" | "hover"
mode   = "overlay"    # "overlay" slides over the text, "push" moves it aside

[markdown.symbols]
mode  = "around-cursor"   # "always-shown" | "around-cursor" | "always-hidden"
scope = "element"         # "element" | "line" | "block"

[markdown.symbols.overrides]
# Per-syntax modes, for example: link-url = "always-hidden"

[prose.sentence-length]
enabled     = false
short-below = 7
long-above  = 18

[prose.grammar]
enabled  = true
spelling = true
english  = "american"   # "american" | "british" | "canadian" | "australian"

[files]
attachments-folder     = "./images"
update-links-on-rename = true
trash                  = "system"   # "system" | "vault" | "delete"

[editor]
show-inline-title  = true
smart-quotes       = true   # typed " and ' become “ ” and ‘ ’ outside code, math and links
curl-pasted-quotes = true   # pasted text gets curly quotes too
auto-pair          = true   # ( [ { and ` add their closing half; * _ ~ = wrap a selection
code-line-numbers  = false  # number the lines of code blocks; a block's ln: overrides it
renumber-footnotes = true   # numbered footnotes follow reading order once typing pauses
snippets           = true   # expand the snippets in snippets.txt, such as mk and //
replacements       = true   # apply replacements.toml, such as -- to an em dash

[math]
auto-fraction    = true   # x/ becomes \frac{x}{}
matrix-shortcuts = true   # Tab adds & and Enter ends the row in pmatrix, cases, align…
tab-out          = true   # Tab jumps past the next closing bracket, or out of the math
enlarge-brackets = true   # (\sum …) becomes \left( … \right) after a snippet
bracket-colours  = true   # matching brackets in math source share a colour

[daily-notes]
folder   = ""             # from the vault root; "" is the root
format   = "YYYY-MM-DD"   # the note's name, as a Moment.js date format
template = ""             # a note to start each day from, such as "Templates/Daily"

[templates]
folder      = "Templates"
date-format = "YYYY-MM-DD"
time-format = "HH:mm"

[recovery]
interval-minutes = 5   # between snapshots of a note you're editing
keep-days        = 7

[mcp]
enabled = true   # the running app answers `editor mcp` about its tabs, cursor and commands

[appearance]
base-font-size = 12
theme          = "match-system"   # "light" | "dark" | "match-system"

[sync]
auto             = true
interval-minutes = 5
branch           = "master"   # the branch this app commits to and pushes
legacy-branch    = "main"     # merged into branch one way until older tools retire; "" turns it off
device-only      = [".editor/device.toml", ".obsidian/workspace*.json", "**/.DS_Store", ".trash/**"]
