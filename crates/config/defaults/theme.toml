# Built-in theme. Every visual value in the app is one of these tokens.
# A value like "{color.black}" refers to another token.

[theme]
# The mode the tokens outside [dark] describe. Tokens under [dark] replace
# their namesakes while the app is dark: [dark.color] text = "#fff" is
# color.text in dark mode. A vault's theme.toml can set either.
mode = "light"

[color]
black       = "#000000"
white       = "#ffffff"
gray-50     = "#fafafa"
gray-100    = "#f4f4f5"
gray-200    = "#e4e4e7"
gray-400    = "#a1a1aa"
gray-600    = "#52525b"
gray-800    = "#27272a"
accent      = "{color.black}"
on-accent   = "{color.white}"
background  = "{color.white}"
surface     = "{color.gray-50}"
sidebar     = "{color.gray-100}"
text        = "{color.gray-800}"
text-muted  = "{color.gray-600}"
text-faint  = "{color.gray-400}"
selection   = "#e4e4e7"
hover       = "{color.gray-100}"
divider     = "{color.gray-200}"
focus-ring  = "{color.accent}"
shadow      = "rgba(0, 0, 0, 0.12)"
syncing     = "{color.gray-600}"
conflict    = "#c62828"
highlight   = "#fff59d"
link        = "{color.accent}"
# A link's underline, quieter than the link so text stays even.
link-underline = "rgba(0, 0, 0, 0.3)"
code-background = "{color.gray-100}"
# Lines a code block's fence picks out with {1,3-5}.
code-highlight = "rgba(0, 0, 0, 0.055)"
# The window around the note surfaces: tab bar, sidebar and gaps.
app-background = "#f6f6f7"
# Menus, pickers and dialogs, which float over the note.
popover     = "{color.white}"
tooltip     = "#1f1f22"
tooltip-text = "{color.white}"
tooltip-hint = "{color.gray-400}"
# Text that has to stand out from its neighbours, such as matched letters.
text-strong = "#18181b"
# Secondary text that still has to be read, such as a note's folder.
text-detail = "#71717a"
icon        = "#5f5f66"
icon-strong = "{color.text-strong}"
icon-disabled = "#c8c8ce"
# Translucent fills for hover, selection and pressed rows and controls,
# so they read on every surface.
fill-faint  = "rgba(0, 0, 0, 0.035)"
fill        = "rgba(0, 0, 0, 0.05)"
fill-strong = "rgba(0, 0, 0, 0.07)"
fill-pressed = "rgba(0, 0, 0, 0.1)"
field       = "rgba(0, 0, 0, 0.06)"
field-error = "#fce8e8"
# Hairline rings drawn as shadows, around note surfaces and popovers.
ring        = "rgba(0, 0, 0, 0.07)"
popover-ring = "rgba(0, 0, 0, 0.08)"
popover-shadow = "rgba(0, 0, 0, 0.16)"
tab-shadow  = "rgba(0, 0, 0, 0.1)"
backdrop    = "rgba(0, 0, 0, 0.12)"
indent-guide = "rgba(0, 0, 0, 0.08)"
drop-target = "rgba(0, 0, 0, 0.08)"
divider-active = "rgba(0, 0, 0, 0.18)"
drop-zone   = "rgba(0, 0, 0, 0.06)"
drop-zone-ring = "rgba(0, 0, 0, 0.16)"
drop-indicator = "{color.text}"
# A find or search match; the current one takes the highlight colour.
search-match = "rgba(250, 219, 56, 0.45)"
active-search-match = "{color.highlight}"
# The wavy underlines the grammar checker draws: a misspelling, then a
# spacing, repeated-word or article problem.
flag-spelling   = "#d1162d"
flag-mechanical = "#0868d3"
# Comparing a note with an earlier version: lines that restoring it brings
# back, and lines it removes.
diff-added   = "rgba(5, 126, 53, 0.12)"
diff-removed = "rgba(209, 22, 45, 0.1)"
# A switch's knob.
knob        = "{color.background}"
# Grouped rows on the settings screen and the conflict resolver.
card        = "{color.sidebar}"
# The tab stops a snippet left for Tab to visit next.
tab-stop    = "rgba(0, 0, 0, 0.13)"
# The two versions of a note in a sync conflict: their labels, and their
# surfaces at opacity.callout.
this-device  = "#0868d3"
other-device = "#744dee"

# Syntax colours in fenced code blocks: quiet, and readable on the code
# background. Plain code keeps the text colour.
[color.code]
comment  = "#6e6e78"
string   = "#3d6e45"
number   = "#9a5b1e"
constant = "#9a5b1e"
keyword  = "#7a4390"
function = "#2f5f93"
type     = "#26707a"

# Tints behind sentences by length, for sentence-length highlighting.
# Brackets in math source, by how deeply they nest, so a pair's halves
# share a colour. They borrow the code colours, which already read well on
# the page.
[color.math]
bracket-1 = "{color.code.function}"
bracket-2 = "{color.code.number}"
bracket-3 = "{color.code.keyword}"

[color.sentence]
short  = "#e3f2fd"
medium = "#fff3e0"
long   = "#ffebee"

# Callout titles and icons; the callout's surface is this at
# opacity.callout.
[color.callout]
# Obsidian's hues, darkened just enough that each title reads at 4.5:1 or
# better on its own 10% tint.
note     = "#0868d3"
abstract = "#007876"
info     = "#0868d3"
todo     = "#0868d3"
tip      = "#007876"
success  = "#057e35"
question = "#aa5400"
warning  = "#aa5400"
failure  = "#d1162d"
danger   = "#d1162d"
bug      = "#d1162d"
example  = "#744dee"
quote    = "#6b6b6b"
custom   = "#0868d3"

[opacity]
callout = 0.1
# A file tree entry that's been cut and waits to be pasted.
cut     = 0.5

# The dark palette: warm near-black surfaces that get lighter as they rise
# (window, sidebar, note, code, popover, tooltip), off-white text, and an
# accent that's light rather than black. Everything not set here keeps its
# light value.
[dark.theme]
mode = "dark"

[dark.color]
gray-50     = "#201f1d"
gray-100    = "#252421"
gray-200    = "#312f2c"
gray-400    = "#6f6b64"
gray-600    = "#aaa59d"
gray-800    = "#e2ded7"
accent      = "#ebe7e0"
on-accent   = "#1c1b19"
background  = "#1c1b19"
sidebar     = "#181715"
selection   = "#3d3a35"
hover       = "#262522"
shadow      = "rgba(0, 0, 0, 0.45)"
conflict    = "#ec6a5e"
highlight   = "#4f4418"
link-underline = "rgba(235, 231, 224, 0.4)"
app-background = "#151412"
popover     = "#262522"
tooltip     = "#3b3934"
tooltip-text = "#f2efea"
tooltip-hint = "#aaa59d"
text-strong = "#f7f5f1"
text-detail = "#958f86"
icon        = "#a29d94"
icon-disabled = "#4d4a45"
fill-faint  = "rgba(255, 255, 255, 0.035)"
fill        = "rgba(255, 255, 255, 0.055)"
fill-strong = "rgba(255, 255, 255, 0.08)"
tab-stop    = "rgba(255, 255, 255, 0.2)"
fill-pressed = "rgba(255, 255, 255, 0.12)"
field       = "rgba(255, 255, 255, 0.06)"
field-error = "#40211e"
ring        = "rgba(255, 255, 255, 0.06)"
popover-ring = "rgba(255, 255, 255, 0.09)"
popover-shadow = "rgba(0, 0, 0, 0.5)"
tab-shadow  = "rgba(0, 0, 0, 0.35)"
backdrop    = "rgba(0, 0, 0, 0.4)"
indent-guide = "rgba(255, 255, 255, 0.08)"
drop-target = "rgba(255, 255, 255, 0.08)"
divider-active = "rgba(255, 255, 255, 0.22)"
drop-zone   = "rgba(255, 255, 255, 0.05)"
drop-zone-ring = "rgba(255, 255, 255, 0.18)"
card        = "#1f1e1b"
code-highlight = "rgba(255, 255, 255, 0.06)"
search-match = "rgba(234, 179, 8, 0.2)"
active-search-match = "#6b5a17"
flag-spelling   = "#f1707d"
flag-mechanical = "#5ea4f2"
diff-added   = "rgba(82, 200, 126, 0.16)"
diff-removed = "rgba(241, 112, 125, 0.14)"
this-device  = "#5ea4f2"
other-device = "#a88ef8"

[dark.color.code]
comment  = "#958f86"
string   = "#a3c48e"
number   = "#e2ab77"
constant = "#e2ab77"
keyword  = "#c9a3e2"
function = "#92b6e4"
type     = "#80c6ca"

[dark.color.math]
bracket-1 = "{color.code.function}"
bracket-2 = "{color.code.number}"
bracket-3 = "{color.code.keyword}"

[dark.color.sentence]
short  = "#1d2a36"
medium = "#352b1b"
long   = "#3b2023"

[dark.color.callout]
note     = "#5ea4f2"
abstract = "#44cfcb"
info     = "#5ea4f2"
todo     = "#5ea4f2"
tip      = "#44cfcb"
success  = "#52c87e"
question = "#f0a054"
warning  = "#f0a054"
failure  = "#f1707d"
danger   = "#f1707d"
bug      = "#f1707d"
example  = "#a88ef8"
quote    = "#a8a39b"
custom   = "#5ea4f2"

[dark.opacity]
callout = 0.13

[font]
text = "Charter"
ui   = "Charter"
code = "Courier New"

[font.weight]
regular = 400
medium  = 500
bold    = 700

# Font sizes are multiples of the base font size setting.
[font.scale]
body    = 1.0
small   = 0.875
ui      = 1.0
code    = 0.95
h1      = 1.8
h2      = 1.5
h3      = 1.3
h4      = 1.15
h5      = 1.0
h6      = 1.0
title   = 2.0

[font.line-height]
body = 1.6
ui   = 1.3
code = 1.45

# Headings set tighter than body text, with room above them in ems of
# their own size, so each sits closer to the text it introduces.
[font.heading]
line-height = 1.3
space-above = 0.5

[size]
sidebar-width   = 260
tab-height      = 32
status-height   = 24
toolbar-height  = 36
editor-max-width = 720
hover-edge-width = 8
icon            = 16

# Toolbars (toolbars.toml): a button's square side and the space between
# buttons at each density, the padding inside a bar that floats or runs
# down a window edge, and how near an edge the pointer comes before a bar
# shown on hover appears. A floating bar's corners are a button's radius
# plus the padding, so the two stay concentric.
[toolbar]
compact-button     = 26
comfortable-button = 32
compact-gap        = 2
comfortable-gap    = 6
compact-icon       = 16
comfortable-icon   = 18
padding            = 4
button-radius      = 6
label-gap          = 6
float-gap          = 8
hover-edge         = 10
separator-width    = 1

[space]
xs = 2
sm = 4
md = 8
lg = 12
xl = 16
xxl = 24

[radius]
sm   = 4
md   = 6
lg   = 10
pill = 999

[shadow]
popover = "0 4px 16px {color.shadow}"
sidebar = "2px 0 12px {color.shadow}"
tab     = "0 1px 2px {color.shadow}"

[curve]
standard   = "cubic-bezier(0.2, 0, 0, 1)"
decelerate = "cubic-bezier(0, 0, 0, 1)"
accelerate = "cubic-bezier(0.3, 0, 1, 1)"

[duration]
fast   = "120ms"
normal = "200ms"
slow   = "320ms"

[animation]
sidebar-reveal = "{duration.normal} {curve.decelerate}"
sidebar-hide   = "{duration.fast} {curve.accelerate}"
