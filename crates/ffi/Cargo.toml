[package]
name = "editor-ffi"
description = "UniFFI surface for the iPhone app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `apps/ios/scripts/build-core.sh` builds the static library for iOS with
# `cargo rustc --crate-type staticlib`, so the desktop builds skip it.
crate-type = ["lib"]

[dependencies]
editor-config = { path = "../config" }
editor-core = { path = "../core" }
editor-export = { path = "../export" }
editor-prose = { path = "../prose" }
editor-search = { path = "../search" }
editor-sync = { path = "../sync", features = ["keychain"] }
editor-vault = { path = "../vault" }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uniffi = { version = "0.32", default-features = false }

[dev-dependencies]
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3"

[lints]
workspace = true
