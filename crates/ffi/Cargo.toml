[package]
name = "gasp-ffi"
description = "UniFFI surface for the iPhone app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `apps/ios/scripts/build-core.sh` builds the static library for iOS with
# `cargo rustc --crate-type staticlib`, so the desktop builds skip it.
crate-type = ["lib"]

[dependencies]
gasp-config = { path = "../config" }
gasp-core = { path = "../core" }
gasp-export = { path = "../export" }
gasp-highlight = { path = "../highlight" }
gasp-math = { path = "../math" }
gasp-prose = { path = "../prose" }
gasp-search = { path = "../search" }
gasp-sync = { path = "../sync", features = ["keychain"] }
gasp-vault = { path = "../vault" }
# Rasterises rendered math, as the desktop does; the desktop already
# builds this version.
resvg = { version = "0.45", default-features = false }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uniffi = { version = "0.32", default-features = false }

[dev-dependencies]
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
tempfile = "3"

[lints]
workspace = true
