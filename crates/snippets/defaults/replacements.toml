# The built-in replacements, which follow Smart Typography's defaults.
# Curly quotes are the smart quotes setting's job, so they aren't here.
# A vault's .editor/replacements.toml replaces this table.

[[replacement]]
from = "--"
to = "—"
group = "Dashes"

[[replacement]]
from = "—-"
to = "---"
group = "Dashes"

[[replacement]]
from = "..."
to = "…"
group = "Ellipsis"

[[replacement]]
from = "<-"
to = "←"
group = "Arrows"

[[replacement]]
from = "->"
to = "→"
group = "Arrows"

[[replacement]]
from = "<<"
to = "«"
group = "Guillemets"
enabled = false

[[replacement]]
from = ">>"
to = "»"
group = "Guillemets"
enabled = false

[[replacement]]
from = ">="
to = "≥"
group = "Comparisons"

[[replacement]]
from = "<="
to = "≤"
group = "Comparisons"

[[replacement]]
from = "/="
to = "≠"
group = "Comparisons"
