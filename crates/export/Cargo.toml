[package]
name = "gasp-export"
description = "HTML and PDF export."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gasp-math = { path = "../math" }
# The note's HTML subset: attribute and CSS parsing, shared with the editor.
gasp-core = { path = "../core" }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
# The same features Typst enables, so the crate is built once.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-html = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
# Page images for the print preview.
typst-render = "0.15.1"

[dev-dependencies]
lopdf = "0.36"

[lints]
workspace = true
