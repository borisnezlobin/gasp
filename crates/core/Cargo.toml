[package]
name = "gasp-core"
description = "Document model, transactions, undo, parser, input pipeline and render planner."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ropey = "1.6"
regex = "1"
gasp-config = { path = "../config" }
gasp-snippets = { path = "../snippets" }
pulldown-cmark = { version = "0.13.4", default-features = false }
memchr = "2"
smallvec = { version = "1", features = ["union"] }
unicode-width = "0.2"
url = "2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
gasp-bench = { path = "../bench" }
gasp-migrate = { path = "../../tools/migrate" }
