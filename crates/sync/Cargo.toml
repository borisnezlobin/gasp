[package]
name = "gasp-sync"
description = "Git sync engine, merge policy and conflict model."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gasp-config = { path = "../config" }
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "windows"))'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native"] }

# The Secret Service (GNOME Keyring, KWallet), through libdbus, which every
# Linux desktop has.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }

[features]
# The system's credential store: the Keychain on macOS and iOS, Credential
# Manager on Windows, the Secret Service on Linux.
keychain = ["dep:keyring"]

[dev-dependencies]
gasp-bench = { path = "../bench" }
tempfile = "3"

[lints]
workspace = true
