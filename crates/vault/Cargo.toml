[package]
name = "gasp-vault"
description = "The vault on disk without a UI: the link index, links that follow moved notes, file operations and atomic writes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gasp-config = { path = "../config" }
dirs = "5"
jiff = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
trash = "5"

[dev-dependencies]
gasp-bench = { path = "../bench" }
tempfile = "3"

[lints]
workspace = true
