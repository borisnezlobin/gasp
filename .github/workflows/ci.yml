name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info and incremental caches for GPUI and Typst overflow the runners' disks.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is skipped for now: it took 14 of CI's 15 minutes.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Linux GPUI packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev clang xvfb mesa-vulkan-drivers
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  bench:
    name: Editor layout bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install GPUI packages, a virtual display and a window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev clang xvfb mesa-vulkan-drivers openbox
      - name: Build the release binary
        run: cargo build --release --locked -p gasp-desktop
      # GPUI's X11 client can miss its first map event without a window
      # manager, so the window never draws. openbox provides one.
      - name: Run the bench
        timeout-minutes: 8
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c \
            'openbox & sleep 1; target/release/gasp --bench-layout fixtures/corpus'
      # An idle window draws nothing and stays under the CPU limit.
      - name: Check idle CPU
        timeout-minutes: 2
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c \
            'openbox & sleep 1; scripts/idle-cpu.sh target/release/gasp fixtures/corpus'

  # The shared crates' benches, each with budgets about three times what
  # they measure on a Mac, so a regression fails the build. They time wall
  # clock; GASP_BENCH_CLOCK=cpu times the thread's CPU instead, for
  # comparing on a busy machine.
  core-bench:
    name: Core benches
    runs-on: ubuntu-latest
    env:
      GASP_BENCH_ENFORCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config clang
      - name: Build the benches
        run: >-
          cargo build --release --locked
          -p gasp-core -p gasp-config -p gasp-ffi -p gasp-search -p gasp-vault
          -p gasp-math -p gasp-prose -p gasp-export -p gasp-sync
          --example core_bench --example config_bench --example ffi_bench
          --example search_bench --example vault_bench
          --example math_bench --example prose_bench --example export_bench
          --example sync_bench
      - name: Parser, planner and typing
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-core --example core_bench
      - name: Config
        timeout-minutes: 2
        run: cargo run --release --locked -p gasp-config --example config_bench
      - name: What the phone asks per keystroke
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-ffi --example ffi_bench
      - name: Search
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-search --example search_bench
      - name: Vault
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-vault --example vault_bench
      - name: Math
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-math --example math_bench
      - name: Prose and grammar
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-prose --example prose_bench
      - name: Export
        timeout-minutes: 5
        run: cargo run --release --locked -p gasp-export --example export_bench
      # A 261 MB vault shaped like the owner's, about 1.3 GB of temporary
      # disk while it runs.
      - name: Sync
        timeout-minutes: 8
        run: cargo run --release --locked -p gasp-sync --example sync_bench

  lint:
    name: Format and complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Install rust-code-analysis
        run: cargo install rust-code-analysis-cli --version 0.0.25 --locked
      - name: Cyclomatic complexity
        run: python3 scripts/check-complexity.py
