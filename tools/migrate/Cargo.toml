[package]
name = "gasp-migrate"
description = "One-shot importer for .obsidian settings, hotkeys and snippets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "gasp-migrate"
path = "src/main.rs"

[dependencies]
gasp-snippets = { path = "../../crates/snippets" }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
gasp-config = { path = "../../crates/config" }

[lints]
workspace = true
