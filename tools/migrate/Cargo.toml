[package]
name = "editor-migrate"
description = "One-shot importer for .obsidian settings, hotkeys and snippets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "editor-migrate"
path = "src/main.rs"

[dependencies]
editor-snippets = { path = "../../crates/snippets" }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
editor-config = { path = "../../crates/config" }

[lints]
workspace = true
